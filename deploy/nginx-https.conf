# Install only AFTER a certificate exists at the specified paths.
limit_req_zone $binary_remote_addr zone=kanban_integrations:1m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name kanban.trisoft.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/kanban-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kanban.trisoft.ru;
    ssl_certificate /etc/letsencrypt/live/kanban.trisoft.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanban.trisoft.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    location ^~ /api/integrations/v1/ {
        include /etc/nginx/snippets/kanban-bot-allow.conf;
        limit_req zone=kanban_integrations burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This Nginx is directly reachable, not behind another proxy/CDN.
        # Overwrite, do NOT propagate client-provided forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/integrations/v1 { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
